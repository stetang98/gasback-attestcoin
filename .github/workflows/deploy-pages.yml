name: Publish GasBack

on:
  push:
    branches: [main]
    paths:
      - 'web/dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Upload the reviewed static app and public demonstration
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
